<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>LogBook Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────── -->
<header class="header">
  <div class="logo">Log<span>Book</span></div>
  <div class="header-actions">
    <button class="icon-btn" id="btn-book" title="Adicionar livro manualmente">📚</button>
    <button class="icon-btn" id="btn-bulk" title="Captura em lote">⿻</button>
    <button class="icon-btn" id="btn-draft" title="Rascunho de artigo com IA">✦</button>
    <button class="icon-btn" id="btn-queue">
      Fila <span class="badge hidden" id="badge-count">0</span>
    </button>
    <button class="icon-btn" id="btn-manage" title="Gerenciar entradas">🗂</button>
    <button class="icon-btn" id="btn-settings">⚙</button>
  </div>
</header>

<!-- ── Capture view ─────────────────────────────────────────────────────── -->
<div class="view" id="view-capture">
  <div class="type-row">
    <select id="sel-type">
      <option value="conteudo">Conteúdo</option>
      <option value="projeto">Projeto</option>
    </select>
    <select id="sel-subtype">
      <option value="artigo">Artigo</option>
      <option value="notícia">Notícia</option>
      <option value="vídeo">Vídeo</option>
      <option value="livro">Livro</option>
      <option value="curso">Curso</option>
      <option value="treinamento">Treinamento</option>
    </select>
  </div>

  <div class="form">
    <div class="field">
      <label>Título</label>
      <input type="text" id="f-title" placeholder="Título da entrada">
    </div>

    <div class="field" id="field-url">
      <label>URL</label>
      <input type="url" id="f-url" placeholder="https://...">
    </div>

    <div class="field" id="field-author">
      <label>Autor / Fonte</label>
      <input type="text" id="f-author" placeholder="Autor ou nome do site">
    </div>

    <!-- Projeto-only -->
    <div class="field hidden" id="field-pitch">
      <label>Pitch (uma linha)</label>
      <input type="text" id="f-pitch" placeholder="O que é este projeto em uma frase">
    </div>

    <div class="field">
      <label>Tags</label>
      <input type="text" id="f-tags" placeholder="ai, produtividade, design">
    </div>

    <div class="field">
      <label>
        Status
      </label>
      <select id="sel-status">
        <option value="consumido">Consumido</option>
        <option value="em andamento">Em andamento</option>
        <option value="abandonado">Abandonado</option>
      </select>
    </div>

    <div class="field" id="field-rating">
      <label>Avaliação</label>
      <div class="rating" id="rating">
        <span data-v="1">★</span>
        <span data-v="2">★</span>
        <span data-v="3">★</span>
        <span data-v="4">★</span>
        <span data-v="5">★</span>
      </div>
    </div>

    <div class="field">
      <label>
        Minhas notas
        <button class="ai-btn" id="btn-ai">✦ AI</button>
      </label>
      <textarea id="f-notes" rows="4" placeholder="O que achei relevante, o que aprendi, por que importa..."></textarea>
    </div>

    <!-- Projeto-only -->
    <div class="field hidden" id="field-desc">
      <label>Descrição / Problema</label>
      <textarea id="f-desc" rows="3" placeholder="Qual problema resolve? Contexto do projeto..."></textarea>
    </div>

    <div class="field">
      <label>Trechos <span class="hint">um por linha — vira citação no artigo</span></label>
      <textarea id="f-quotes" rows="3" placeholder="Cole aqui as frases que você quer guardar"></textarea>
    </div>

    <div class="field hidden" id="field-connections">
      <label>Conexões sugeridas</label>
      <div class="connections-list" id="f-connections"></div>
    </div>

    <div class="field">
      <label class="inline"><input type="checkbox" id="f-private"> Privado (não publica no site)</label>
    </div>
  </div>

  <div class="ai-status" id="ai-status"></div>

  <div class="actions">
    <button class="btn-primary" id="btn-add">+ Adicionar à fila</button>
    <button class="btn-ghost" id="btn-discard">Descartar</button>
  </div>
</div>

<!-- ── Queue view ────────────────────────────────────────────────────────── -->
<div class="view hidden" id="view-queue">
  <div class="queue-header">
    <span class="count" id="queue-label">0 itens</span>
    <button class="btn-push" id="btn-push" disabled>↑ Push GitHub</button>
  </div>
  <div class="queue-list" id="queue-list"></div>
  <div class="hidden" id="private-row" style="display:flex;align-items:center;gap:8px;margin-top:8px">
    <span class="hint" id="private-label"></span>
    <button class="btn-ghost" id="btn-export-private" style="margin-left:auto">Exportar</button>
  </div>
  <div id="push-toast"></div>
  <div class="actions" style="margin-top:12px">
    <button class="btn-ghost" id="btn-back-queue">← Voltar</button>
  </div>
</div>

<!-- ── Settings view ─────────────────────────────────────────────────────── -->
<div class="view hidden" id="view-settings">
  <div class="settings-title">Configurações</div>
  <div class="form">
    <div class="field">
      <label>AI Provider</label>
      <select id="s-provider">
        <option value="claude">Claude (Anthropic)</option>
        <option value="openai">OpenAI</option>
        <option value="none">Sem AI</option>
      </select>
    </div>
    <div class="field" id="s-claude-row">
      <label>Claude API Key</label>
      <input type="password" id="s-claude-key" placeholder="sk-ant-api03-...">
    </div>
    <div class="field hidden" id="s-openai-row">
      <label>OpenAI API Key</label>
      <input type="password" id="s-openai-key" placeholder="sk-...">
    </div>

    <hr class="divider">

    <div class="field">
      <label>GitHub Token (PAT)</label>
      <input type="password" id="s-gh-token" placeholder="ghp_...">
    </div>
    <div class="field">
      <label>Repositório (owner/repo)</label>
      <input type="text" id="s-gh-repo" placeholder="lurzzo/contentblog">
    </div>
    <div class="field">
      <label>Branch</label>
      <input type="text" id="s-gh-branch" placeholder="main">
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="btn-save-settings">Salvar</button>
    <button class="btn-ghost" id="btn-back-settings">← Voltar</button>
  </div>
</div>

<!-- ── Book manual entry view ─────────────────────────────────────────────── -->
<div class="view hidden" id="view-book">
  <div class="settings-title">Adicionar livro</div>
  <div class="form">
    <div class="field">
      <label>Título *</label>
      <input type="text" id="bk-title" placeholder="Nome do livro">
    </div>
    <div class="field">
      <label>Autor(a)</label>
      <input type="text" id="bk-author" placeholder="Nome do autor(a)">
    </div>
    <div class="field">
      <label>Status</label>
      <select id="bk-status">
        <option value="quero ler">Quero ler</option>
        <option value="em andamento">Lendo agora</option>
        <option value="consumido">Já li</option>
        <option value="abandonado">Abandonado</option>
      </select>
    </div>
    <div class="field">
      <label>Tags</label>
      <input type="text" id="bk-tags" placeholder="ficção, negócios, filosofia">
    </div>
    <div class="field" id="bk-field-rating">
      <label>Avaliação</label>
      <div class="rating" id="bk-rating">
        <span data-v="1">★</span>
        <span data-v="2">★</span>
        <span data-v="3">★</span>
        <span data-v="4">★</span>
        <span data-v="5">★</span>
      </div>
    </div>
    <div class="field">
      <label>Notas</label>
      <textarea id="bk-notes" rows="3" placeholder="Por que quer ler? O que achou?"></textarea>
    </div>
    <div class="field">
      <label>Link (Amazon, Goodreads…)</label>
      <input type="url" id="bk-url" placeholder="https://…">
    </div>
  </div>
  <div class="actions">
    <button class="btn-primary" id="btn-book-add">+ Adicionar à fila</button>
    <button class="btn-ghost" id="btn-book-back">← Voltar</button>
  </div>
</div>

<!-- ── Manage view ────────────────────────────────────────────────────────── -->
<div class="view hidden" id="view-manage">
  <div class="queue-header">
    <span class="count" id="manage-label">Carregando...</span>
  </div>
  <input type="search" id="manage-search" placeholder="Filtrar por título ou autor..." style="width:100%;margin-bottom:8px">
  <div class="queue-list" id="manage-list"></div>
  <div id="manage-toast"></div>
  <div class="actions" style="margin-top:12px">
    <button class="btn-ghost" id="btn-back-manage">← Voltar</button>
  </div>
</div>

<!-- ── Captura em lote ──────────────────────────────────────────────────── -->
<div class="view hidden" id="view-bulk">
  <div class="queue-header"><span class="count">Várias URLs de uma vez</span></div>
  <div class="form">
    <div class="field">
      <label>URLs <span class="hint">uma por linha</span></label>
      <textarea id="bulk-urls" rows="8" placeholder="https://...&#10;https://..."></textarea>
    </div>
    <div class="field">
      <label>Status de todas</label>
      <select id="bulk-status">
        <option value="quero ler">Quero ler</option>
        <option value="consumido">Consumido</option>
        <option value="em andamento">Em andamento</option>
      </select>
    </div>
    <div class="field">
      <label>Tags de todas</label>
      <input type="text" id="bulk-tags" placeholder="opcional">
    </div>
  </div>
  <div id="bulk-toast"></div>
  <div class="actions">
    <button class="btn-primary" id="btn-bulk-add">Adicionar à fila</button>
    <button class="btn-ghost" id="btn-bulk-back">← Voltar</button>
  </div>
</div>

<!-- ── Rascunho de artigo por IA ─────────────────────────────────────────── -->
<div class="view hidden" id="view-draft">
  <div class="queue-header"><span class="count" id="draft-label">Escolha os materiais</span></div>
  <input type="search" id="draft-search" placeholder="Filtrar..." style="width:100%;margin-bottom:8px">
  <div class="queue-list" id="draft-list"></div>
  <div class="form">
    <div class="field">
      <label>Sobre o que é o artigo <span class="hint">opcional, ajuda a IA</span></label>
      <input type="text" id="draft-angle" placeholder="ex: por que provas de conceito não viram produto">
    </div>
  </div>
  <div id="draft-toast"></div>
  <div class="actions">
    <button class="btn-primary" id="btn-draft-gen">✦ Gerar rascunho</button>
    <button class="btn-ghost" id="btn-draft-back">← Voltar</button>
  </div>
</div>

<!-- ── Edit view (marcar como lido / editar entrada publicada) ───────────── -->
<div class="view hidden" id="view-edit">
  <div class="queue-header">
    <span class="count" id="edit-title">—</span>
  </div>
  <div class="form">
    <div class="field">
      <label>Status</label>
      <select id="e-status"></select>
    </div>
    <div class="field">
      <label>Consumido em</label>
      <input type="date" id="e-consumed">
    </div>
    <div class="field">
      <label>Avaliação</label>
      <div class="rating" id="e-rating">
        <span data-v="1">★</span>
        <span data-v="2">★</span>
        <span data-v="3">★</span>
        <span data-v="4">★</span>
        <span data-v="5">★</span>
      </div>
    </div>
    <div class="field">
      <label>Tags</label>
      <input type="text" id="e-tags" placeholder="ia, produtividade">
    </div>
    <div class="field">
      <label>Minhas notas</label>
      <textarea id="e-notes" rows="5" placeholder="O que ficou disso?"></textarea>
    </div>
  </div>
  <div id="edit-toast"></div>
  <div class="actions">
    <button class="btn-primary" id="btn-edit-save">Salvar no GitHub</button>
    <button class="btn-ghost" id="btn-edit-back">← Voltar</button>
  </div>
</div>

<script src="chrome-mock.js"></script>
<script src="popup.js" type="module"></script>
</body>
</html>
