name: captura

# Captura pelo celular sem token: você compartilha o link para uma issue com o
# rótulo `captura` e a Action escreve no data.json. Nada de PAT no aparelho.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  adicionar:
    if: contains(github.event.issue.labels.*.name, 'captura')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Só o dono do repositório pode capturar — a issue é pública.
      - name: Conferir autor
        if: github.event.issue.user.login != github.repository_owner
        run: |
          echo "Issue de terceiro, ignorada."
          exit 1

      - name: Corpo da issue para arquivo
        env:
          CORPO: ${{ github.event.issue.body }}
        run: printf '%s' "$CORPO" > /tmp/issue.txt

      - name: Converter em entrada
        id: add
        env:
          TITULO: ${{ github.event.issue.title }}
        run: python3 tools/issue_to_entry.py /tmp/issue.txt "$TITULO" | tee /tmp/saida.txt

      - name: Commitar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "add: captura via issue #${{ github.event.issue.number }}"
          git push

      - name: Fechar a issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "$(cat /tmp/saida.txt)"
          gh issue close ${{ github.event.issue.number }}
