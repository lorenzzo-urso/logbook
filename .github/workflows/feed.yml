name: feed

# A extensão grava data.json direto pela API do GitHub, então o feed precisa
# ser regenerado aqui — senão fica desatualizado a cada captura.
on:
  push:
    paths: ['data.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Só o feed: posts.json depende do npx e é gerado no ./build.sh local.
      - run: python3 tools/gen_feed.py
      - name: Commit feed.xml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "chore: regenera feed.xml"
          git push
